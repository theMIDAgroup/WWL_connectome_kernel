[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wwl_connectomics"
version = "0.1.0"
description = "Wasserstein Weisfeiler-Lehman kernel pipeline for structural/functional connectome comparison"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "networkx",
    "matplotlib",
    "nilearn",
    "joblib",
]

[project.optional-dependencies]
docs = ["sphinx", "sphinx-rtd-theme"]

[tool.setuptools.packages.find]
include = ["wwl_connectomics*"]
